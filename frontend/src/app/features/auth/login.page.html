<main class="login">
  <section class="card login-card">
    <h1>KAI · Chauffeurs & parc</h1>
    <p class="muted">Connectez-vous pour accéder à la plateforme.</p>

    @if (error(); as message) {
      <p class="alert alert-danger" role="alert">{{ message }}</p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="field">
        <span>Adresse e-mail</span>
        <input class="input" type="email" formControlName="email" autocomplete="username" />
        <app-field-error [control]="form.controls.email" />
      </label>
      <label class="field">
        <span>Mot de passe</span>
        <input class="input" type="password" formControlName="password" autocomplete="current-password" />
        <app-field-error [control]="form.controls.password" />
      </label>
      <button class="btn btn-primary btn-block" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Connexion…' : 'Se connecter' }}
      </button>
    </form>

    @if (demoMode) {
      <div class="demo-accounts">
        <p class="muted">Mode démo — mot de passe : <code>{{ demoPassword }}</code></p>
        <ul>
          @for (user of demoUsers; track user.id) {
            <li>
              <button type="button" class="link" (click)="fillDemo(user.email)">{{ user.email }}</button>
              <span class="muted">{{ roleLabels[user.role] }}</span>
            </li>
          }
        </ul>
      </div>
    }
  </section>
</main>
